display_name: Agnes-AI
description: Generate text, describe images, and create images/videos using Agnes AI models (agnes-3.0-flash, agnes-image-2.5-flash, agnes-video-2.5-flash)
prompt: |
  You have access to the agnes CLI tool for Agnes AI API.
  Run `python3 scripts/agnes.py --help` to see available commands.
  For text generation use `agnes text` (default: agnes-3.0-flash).
  For image generation use `agnes image` (default: agnes-image-2.5-flash).
  For video generation use `agnes video` (default: agnes-video-2.5-flash).
  Never hardcode API keys — read from env var AGNES_API_KEY.
